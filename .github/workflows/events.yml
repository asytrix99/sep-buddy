name: Collect student events

on:
  schedule:
    - cron: '17 4 * * *' # every day ~05:17/06:17 Swedish time
  workflow_dispatch: {} # "Run workflow" button in the Actions tab
  push:
    paths: ['data/**', 'scripts/collect-events.js']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-events.js
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }} # optional — Linköping city events
      - name: Commit events.json if it changed
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json data/geocode-cache.json
          git diff --cached --quiet || (git commit -m "Update events" && git push)
